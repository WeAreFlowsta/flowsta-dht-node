# Cloud Build: the Flowsta node agent image.
#
# Builds the Dockerfile in this directory (agent + public hApp bundles) and
# pushes it to the public Artifact Registry repo, tagged with the version.
# The node manifest pins the agent by DIGEST; copy it from the build output.
#
# Usage:
#   gcloud builds submit --config=cloudbuild.yaml \
#     --substitutions=_VERSION=2.0.0 --project=flowsta-475001

substitutions:
  _VERSION: 'dev'
  _REPO: 'us-docker.pkg.dev/flowsta-475001/public'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '--build-arg'
      - 'AGENT_VERSION=${_VERSION}'
      - '-t'
      - '${_REPO}/flowsta-dht-node:${_VERSION}'
      - '.'

images:
  - '${_REPO}/flowsta-dht-node:${_VERSION}'

timeout: '900s'
