# SNI pass-through for two bootstrap generations on one :443.
# Reads the server name from the TLS hello, forwards the encrypted bytes
# to the matching kitsune2 bootstrap server (each terminates its own TLS).
# Nothing is decrypted here.
global
    log stdout format raw local0
    maxconn 20000

defaults
    mode tcp
    log global
    option tcplog
    timeout connect 10s
    timeout client  1h
    timeout server  1h

frontend bootstrap_443
    bind :::443 v4v6
    tcp-request inspect-delay 5s
    tcp-request content accept if { req.ssl_hello_type 1 }
    use_backend srv_07 if { req.ssl_sni -i "${TLS_DOMAIN_07}" }
    default_backend srv_06

backend srv_06
    server s06 127.0.0.1:8443

backend srv_07
    server s07 127.0.0.1:8444
