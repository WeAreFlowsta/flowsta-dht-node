# Cloud Build: the Flowsta edge node image for one Holochain version.
#
# Builds Dockerfile.edgenode (Holo Host's edge node + the official conductor
# binary) and pushes it to the public Artifact Registry repo. The node
# manifest pins the image by DIGEST: read it from the build output
# ("digest: sha256:...") or `gcloud artifacts docker images describe`.
#
# Usage:
#   gcloud builds submit --config=cloudbuild-edgenode.yaml \
#     --substitutions=_HOLOCHAIN_VERSION=0.7.1 --project=flowsta-475001
#
# With the conductor from WeAreFlowsta/holochain-build (its SHA-256 is in that
# release's SHA256SUMS.txt):
#   --substitutions=_HOLOCHAIN_VERSION=0.7.1,_HOLOCHAIN_BUILD=flowsta.4,_HOLOCHAIN_BUILD_SHA256=<sha256>,_TAG=hc0.7.1-flowsta.4

substitutions:
  _HOLOCHAIN_VERSION: '0.6.1'
  _HOLOCHAIN_BUILD: ''
  _HOLOCHAIN_BUILD_SHA256: ''
  _TAG: 'hc${_HOLOCHAIN_VERSION}'
  _REPO: 'us-docker.pkg.dev/flowsta-475001/public'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.edgenode'
      - '--build-arg'
      - 'HOLOCHAIN_VERSION=${_HOLOCHAIN_VERSION}'
      - '--build-arg'
      - 'HOLOCHAIN_BUILD=${_HOLOCHAIN_BUILD}'
      - '--build-arg'
      - 'HOLOCHAIN_BUILD_SHA256=${_HOLOCHAIN_BUILD_SHA256}'
      - '-t'
      - '${_REPO}/flowsta-edgenode:${_TAG}'
      - '.'

images:
  - '${_REPO}/flowsta-edgenode:${_TAG}'

timeout: '600s'

options:
  dynamicSubstitutions: true
