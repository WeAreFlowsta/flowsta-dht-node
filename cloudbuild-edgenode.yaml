# Cloud Build: the Flowsta edge node image for one Holochain version.
#
# Builds Dockerfile.edgenode (Holo Host's edge node + the official conductor
# binary) and pushes it to the public Artifact Registry repo. The node
# manifest pins the image by DIGEST: read it from the build output
# ("digest: sha256:...") or `gcloud artifacts docker images describe`.
#
# Usage:
#   gcloud builds submit --config=cloudbuild-edgenode.yaml \
#     --substitutions=_HOLOCHAIN_VERSION=0.7.1 --project=flowsta-475001

substitutions:
  _HOLOCHAIN_VERSION: '0.6.1'
  _REPO: 'us-docker.pkg.dev/flowsta-475001/public'

steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-f'
      - 'Dockerfile.edgenode'
      - '--build-arg'
      - 'HOLOCHAIN_VERSION=${_HOLOCHAIN_VERSION}'
      - '-t'
      - '${_REPO}/flowsta-edgenode:hc${_HOLOCHAIN_VERSION}'
      - '.'

images:
  - '${_REPO}/flowsta-edgenode:hc${_HOLOCHAIN_VERSION}'

timeout: '600s'
