# Flowsta Community Node
#
# One container you run; the rest the agent runs for you.
#
#   agent          pulls the signed node manifest from Flowsta, verifies the
#                  signature against Team Flowsta's identity baked into the
#                  image, and keeps this node at what the manifest says: one
#                  Holochain conductor per generation (its own data volume,
#                  admin port and bootstrap), the public DNAs each generation
#                  lists, and the agent itself. Conductor changes happen in
#                  your maintenance window and roll back if the new conductor
#                  does not verify. Nothing is ever deleted.
#   conductors     created by the agent as flowsta-conductor-<generation>
#                  (for example flowsta-conductor-holochain-0.6 and
#                  flowsta-conductor-holochain-0.7 while both lines run).
#   bootstrap role (optional, --profile bootstrap) one open bootstrap/relay
#                  server per generation behind an SNI pass-through proxy on
#                  :443, each with its own hostname and certificate.
#
# Usage:
#   docker compose up -d                       (existing nodes: add --remove-orphans)
#   docker compose --profile bootstrap up -d   with the bootstrap role

services:
  agent:
    image: ${AGENT_IMAGE:-us-docker.pkg.dev/flowsta-475001/public/flowsta-dht-node:2.0.1}
    container_name: flowsta-agent
    network_mode: host
    restart: unless-stopped
    environment:
      - API_URL=${API_URL}
      - CHANNEL=${CHANNEL:-stable}
      - NODE_LABEL=${NODE_LABEL:-}
      - NODE_SECRET=${NODE_SECRET:-}
      - UPDATE_WINDOW=${UPDATE_WINDOW:-03:00-05:00}
      - SECURITY_UPDATES_ANYTIME=${SECURITY_UPDATES_ANYTIME:-1}
      - TZ=${TZ:-UTC}
      - REPORT_INTERVAL=${REPORT_INTERVAL:-600}
      - REPORT_DISABLED=${REPORT_DISABLED:-0}
      - BOOTSTRAP_AUTH_MATERIAL=${BOOTSTRAP_AUTH_MATERIAL:-}
      - RELAY_AUTH_MATERIAL=${RELAY_AUTH_MATERIAL:-}
      - AGENT_CONTAINER_NAME=flowsta-agent
    volumes:
      # The agent manages the conductor containers through Docker. This is
      # root on the host; the agent only acts on a manifest signed by Flowsta.
      - /var/run/docker.sock:/var/run/docker.sock
      - agent-state:/state
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ── Optional bootstrap role ─────────────────────────────────────────────
  # One SNI pass-through proxy on :443 in front of one bootstrap server per
  # Holochain generation. Each server terminates its own TLS with its own
  # Let's Encrypt certificate: TLS_DOMAIN (0.6 line, kitsune2 0.4.x clients)
  # and TLS_DOMAIN_07 (0.7 line, kitsune2 0.5.x clients). The proxy reads
  # only the hostname in the TLS hello and passes the bytes through; it
  # goes away when the 0.6 generation retires.
  bootstrap-proxy:
    image: haproxy:3.0-alpine
    container_name: flowsta-bootstrap-proxy
    network_mode: host
    restart: unless-stopped
    profiles: ["bootstrap"]
    environment:
      - TLS_DOMAIN=${TLS_DOMAIN}
      - TLS_DOMAIN_07=${TLS_DOMAIN_07:-}
    volumes:
      - ./bootstrap/haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"

  bootstrap-srv-06:
    image: ${BOOTSTRAP_IMAGE_06:-ghcr.io/holochain/kitsune2_bootstrap_srv:v0.4.1}
    container_name: flowsta-bootstrap-srv-06
    network_mode: host
    restart: unless-stopped
    profiles: ["bootstrap"]
    command:
      - "kitsune2-bootstrap-srv"
      - "--production"
      - "--listen"
      - "127.0.0.1:8443"
      - "--tls-cert"
      - "/etc/letsencrypt/live/${TLS_DOMAIN}/fullchain.pem"
      - "--tls-key"
      - "/etc/letsencrypt/live/${TLS_DOMAIN}/privkey.pem"
      # No --authentication-hook-server: community bootstrap is OPEN by
      # design, the network's fallback when the gated primary is unreachable.
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

  bootstrap-srv-07:
    image: ${BOOTSTRAP_IMAGE_07:-ghcr.io/holochain/kitsune2_bootstrap_srv:v0.5.1}
    container_name: flowsta-bootstrap-srv-07
    network_mode: host
    restart: unless-stopped
    profiles: ["bootstrap-07"]
    command:
      - "kitsune2-bootstrap-srv"
      - "--production"
      - "--listen"
      - "127.0.0.1:8444"
      - "--tls-cert"
      - "/etc/letsencrypt/live/${TLS_DOMAIN_07}/fullchain.pem"
      - "--tls-key"
      - "/etc/letsencrypt/live/${TLS_DOMAIN_07}/privkey.pem"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"

volumes:
  agent-state:
